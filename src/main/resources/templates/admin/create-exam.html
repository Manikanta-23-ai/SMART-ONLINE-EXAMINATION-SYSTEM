<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Create Exam - Smart Online Examination System</title>

</head>

<body>

<h1>Smart Online Examination System</h1>

<h2>Create New Exam</h2>

<hr>

<form action="/admin/exams" method="post">

    <!-- Exam Title -->

    <label for="title">
        Exam Title:
    </label>

    <br>

    <input
            type="text"
            id="title"
            name="title"
            placeholder="Example: Java Programming Exam"
            required>

    <br><br>


    <!-- Subject -->

    <label for="subjectId">
        Subject:
    </label>

    <br>

    <select
            id="subjectId"
            name="subjectId"
            required>

        <option value="">
            -- Select Subject --
        </option>

        <option
                th:each="subject : ${subjects}"
                th:value="${subject.id}"
                th:text="${subject.name}">
        </option>

    </select>

    <br><br>


    <!-- Duration -->

    <label for="durationMinutes">
        Duration (Minutes):
    </label>

    <br>

    <input
            type="number"
            id="durationMinutes"
            name="durationMinutes"
            min="1"
            placeholder="60"
            required>

    <br><br>


    <!-- Total Marks -->

    <label for="totalMarks">
        Total Marks:
    </label>

    <br>

    <input
            type="number"
            id="totalMarks"
            name="totalMarks"
            min="1"
            step="0.5"
            placeholder="100"
            required>

    <br><br>


    <!-- Active Status -->

    <label>

        <input
                type="checkbox"
                name="active"
                value="true">

        Activate Exam

    </label>

    <br><br>


    <!-- Submit -->

    <button type="submit">
        Create Exam
    </button>

</form>

<br>

<a href="/admin/exams">
    Back to Exams
</a>

<br><br>

<a href="/dashboard">
    Back to Dashboard
</a>

</body>

</html>
