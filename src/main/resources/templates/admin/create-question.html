<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Create Question - Smart Online Examination System</title>

</head>

<body>

<h1>Smart Online Examination System</h1>

<h2>Create New Question</h2>

<hr>

<!-- ========================= -->
<!-- EXAM INFORMATION -->
<!-- ========================= -->

<h3>Exam Details</h3>

<p>
    <strong>Exam:</strong>

    <span th:text="${exam.title}">
        Java Programming Exam
    </span>
</p>

<p>
    <strong>Subject:</strong>

    <span th:text="${exam.subject.name}">
        Java Programming
    </span>
</p>

<hr>


<!-- ========================= -->
<!-- QUESTION FORM -->
<!-- ========================= -->

<form action="/admin/questions" method="post">

    <!-- Hidden Exam ID -->

    <input
            type="hidden"
            name="examId"
            th:value="${exam.id}">


    <!-- ========================= -->
    <!-- QUESTION -->
    <!-- ========================= -->

    <label for="questionText">
        Question:
    </label>

    <br>

    <textarea
            id="questionText"
            name="questionText"
            rows="5"
            cols="70"
            placeholder="Enter the question"
            required></textarea>

    <br><br>


    <!-- ========================= -->
    <!-- MARKS -->
    <!-- ========================= -->

    <label for="marks">
        Marks:
    </label>

    <br>

    <input
            type="number"
            id="marks"
            name="marks"
            min="0.5"
            step="0.5"
            placeholder="2"
            required>

    <br><br>


    <!-- ========================= -->
    <!-- NEGATIVE MARKS -->
    <!-- ========================= -->

    <label for="negativeMarks">
        Negative Marks:
    </label>

    <br>

    <input
            type="number"
            id="negativeMarks"
            name="negativeMarks"
            min="0"
            step="0.25"
            value="0"
            placeholder="0.5"
            required>

    <br><br>

    <hr>


    <!-- ========================= -->
    <!-- OPTION 1 -->
    <!-- ========================= -->

    <h3>Options</h3>

    <label for="option1">
        Option 1:
    </label>

    <br>

    <input
            type="text"
            id="option1"
            name="option1"
            size="70"
            placeholder="Enter option 1"
            required>

    <br><br>


    <!-- ========================= -->
    <!-- OPTION 2 -->
    <!-- ========================= -->

    <label for="option2">
        Option 2:
    </label>

    <br>

    <input
            type="text"
            id="option2"
            name="option2"
            size="70"
            placeholder="Enter option 2"
            required>

    <br><br>


    <!-- ========================= -->
    <!-- OPTION 3 -->
    <!-- ========================= -->

    <label for="option3">
        Option 3:
    </label>

    <br>

    <input
            type="text"
            id="option3"
            name="option3"
            size="70"
            placeholder="Enter option 3"
            required>

    <br><br>


    <!-- ========================= -->
    <!-- OPTION 4 -->
    <!-- ========================= -->

    <label for="option4">
        Option 4:
    </label>

    <br>

    <input
            type="text"
            id="option4"
            name="option4"
            size="70"
            placeholder="Enter option 4"
            required>

    <br><br>


    <!-- ========================= -->
    <!-- CORRECT ANSWER -->
    <!-- ========================= -->

    <label for="correctOption">
        Correct Answer:
    </label>

    <br>

    <select
            id="correctOption"
            name="correctOption"
            required>

        <option value="">
            -- Select Correct Option --
        </option>

        <option value="1">
            Option 1
        </option>

        <option value="2">
            Option 2
        </option>

        <option value="3">
            Option 3
        </option>

        <option value="4">
            Option 4
        </option>

    </select>

    <br><br>

    <!-- ========================= -->
    <!-- SUBMIT -->
    <!-- ========================= -->

    <button type="submit">
        Create Question
    </button>

</form>

<br>

<a th:href="@{/admin/questions(examId=${exam.id})}">
    Back to Questions
</a>

<br><br>

<a href="/admin/exams">
    Back to Exams
</a>

<br><br>

<a href="/dashboard">
    Back to Dashboard
</a>

</body>

</html>
