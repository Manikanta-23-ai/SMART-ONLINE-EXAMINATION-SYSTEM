<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Available Exams</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f7fa;
        }

        h1 {
            color: #222;
        }

        .exam-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .exam-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .exam-card h2 {
            margin-top: 0;
        }

        .exam-card p {
            margin: 8px 0;
        }

        .start-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .start-btn:hover {
            background: #0056b3;
        }

        .empty {
            background: white;
            padding: 20px;
            margin-top: 20px;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<h1>Smart Online Examination System</h1>

<h2>Available Exams</h2>

<div class="exam-container">

    <div class="exam-card" th:each="exam : ${exams}">

        <h2 th:text="${exam.title}">
            Java Programming Assessment
        </h2>

        <p>
            <strong>Subject:</strong>
            <span th:text="${exam.subject.name}">
                Java Programming
            </span>
        </p>

        <p>
            <strong>Duration:</strong>
            <span th:text="${exam.durationMinutes}">
                30
            </span>
            minutes
        </p>

        <p>
            <strong>Total Marks:</strong>
            <span th:text="${exam.totalMarks}">
                50
            </span>
        </p>

        <a class="start-btn"
           th:href="@{/student/exam/{id}(id=${exam.id})}">
            Start Exam
        </a>

    </div>

</div>

<div class="empty" th:if="${#lists.isEmpty(exams)}">
    <p>No exams are currently available.</p>
</div>

<a class="back" href="/dashboard">
    ← Back to Dashboard
</a>

</body>

</html>
